<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学计算器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <header class="page-header">
            <h1>科学计算器</h1>
        </header>

        <main class="layout">
            <!-- 计算器主体 -->
            <section class="card calculator">
                <div class="screen">
                    <div class="screen-top">
                        <span id="modeBadge" class="mode-badge">DEG</span>
                        <span id="errorText" class="error-text"></span>
                    </div>
                    <div id="expression" class="screen-expr"></div>
                    <div id="result" class="screen-result">0</div>
                </div>

                <div class="keypad">
                    <button class="btn btn-mode" id="modeBtn" data-action="toggleMode">DEG</button>
                    <button class="btn btn-func" data-token="(">(</button>
                    <button class="btn btn-func" data-token=")">)</button>
                    <button class="btn btn-warn" data-action="backspace">←</button>
                    <button class="btn btn-warn" data-action="clear">C</button>

                    <button class="btn btn-func" data-token="sin(">sin</button>
                    <button class="btn btn-func" data-token="cos(">cos</button>
                    <button class="btn btn-func" data-token="tan(">tan</button>
                    <button class="btn btn-const" data-token="π">π</button>
                    <button class="btn btn-op" data-token="÷">÷</button>

                    <button class="btn btn-func" data-token="asin(">asin</button>
                    <button class="btn btn-func" data-token="acos(">acos</button>
                    <button class="btn btn-func" data-token="atan(">atan</button>
                    <button class="btn btn-const" data-token="e">e</button>
                    <button class="btn btn-op" data-token="-">−</button>

                    <button class="btn btn-func" data-token="^2">x²</button>
                    <button class="btn btn-func" data-token="^">xʸ</button>
                    <button class="btn btn-func" data-token="sqrt(">√</button>
                    <button class="btn btn-func" data-token="!">n!</button>
                    <button class="btn btn-op" data-token="×">×</button>

                    <button class="btn btn-num" data-token="7">7</button>
                    <button class="btn btn-num" data-token="8">8</button>
                    <button class="btn btn-num" data-token="9">9</button>
                    <button class="btn btn-func" data-token="ln(">ln</button>
                    <button class="btn btn-op" data-token="+">+</button>

                    <button class="btn btn-num" data-token="4">4</button>
                    <button class="btn btn-num" data-token="5">5</button>
                    <button class="btn btn-num" data-token="6">6</button>
                    <button class="btn btn-func" data-token="log(">log</button>
                    <button class="btn btn-op btn-equals" data-action="calculate" rowspan="2">=</button>

                    <button class="btn btn-num" data-token="1">1</button>
                    <button class="btn btn-num" data-token="2">2</button>
                    <button class="btn btn-num" data-token="3">3</button>
                    <button class="btn btn-func" data-token="exp(">exp</button>

                    <button class="btn btn-num" data-token="0" colspan="2">0</button>
                    <button class="btn btn-num" data-token=".">.</button>
                    <button class="btn btn-const" data-token="ans">Ans</button>
                    <button class="btn btn-func" data-token="%">mod</button>
                </div>
            </section>

            <!-- 历史记录 -->
            <section class="card history">
                <div class="history-header">
                    <h2>计算历史</h2>
                    <button id="clearAllBtn" class="btn-clear-all">清空全部</button>
                </div>
                <ul id="historyList" class="history-list"></ul>
                <div id="historyEmpty" class="history-empty">暂无计算记录</div>
            </section>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
